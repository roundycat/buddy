  <rect x="356" y="1032" width="15" height="15" rx="3" fill="#8C4FFF"/><text class="lg" x="378" y="1044">네트워킹 · 콘텐츠 전송</text>
  <rect x="552" y="1032" width="15" height="15" rx="3" fill="#C925D1"/><text class="lg" x="574" y="1044">데이터베이스 · 개발자 도구</text>
