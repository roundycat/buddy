  <rect x="1140" y="1032" width="15" height="15" rx="3" fill="#DD344C"/><text class="lg" x="1162" y="1044">보안 · 자격 증명</text>

  <!-- ============ 메모 ============ -->
  <text class="gl" x="48" y="1102" fill="#232F3E">구성 메모</text>
  <text class="note" x="48" y="1132">· 저장 경계 — 로그인 자격 증명만 Aurora(VPC 안), 그 밖의 앱 데이터는 전부 DynamoDB. 로컬 개발은 PERSISTENCE 미설정으로 .data/*.json 사용</text>
  <text class="note" x="48" y="1158">· VPC 안 / 밖 — ALB · ECS 태스크 · Aurora 는 VPC 안, DynamoDB · S3 · Bedrock · CloudWatch 는 VPC 밖 관리형 엔드포인트로 호출</text>
  <text class="note" x="48" y="1184">· 레거시 — App Runner bedi-app (us-west-2) 는 ECS 구성이 대체. 03 배포 스크립트와 AppRunner IAM 역할 2개만 남아 있음</text>
  <text class="note" x="48" y="1210" fill="#C7253E">· 위험 3 — Aurora 인터넷 노출(5432 + public) · ECS 태스크 정의 환경변수에 시크릿 평문(OPENAI_API_KEY / PGPASSWORD / AUTH_SESSION_SECRET) · S3 버킷 용도 혼재</text>
  <text class="note" x="48" y="1236">· 미확인 — CloudFront 배포는 생성 스크립트가 없어 수동 구성으로 추정. CloudFront → ALB 구간은 HTTP(평문)이며 ALB 에 인증서 없음</text>
  <text class="xs" x="48" y="1268">색상 팔레트 출처: awslabs/aws-icons-for-plantuml (Apache-2.0) 의 카테고리 색상 정의. 아이콘 글리프는 이 다이어그램을 위해 직접 작도한 것으로 AWS 공식 에셋 패키지가 아닙니다.</text>
</svg>
