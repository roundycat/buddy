<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B2BE0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6675"/></marker>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font-size: 33px; font-weight: 700; fill: #16202E; }
      .sub { font-size: 14.5px; fill: #5A6675; }
      .lg { font-size: 12.5px; fill: #5A6675; }
      .lane { font-size: 22px; font-weight: 700; }
      .badge { font-size: 12px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1.2px; }
      .who { font-size: 12.5px; fill: #48546A; }
      .st { font-size: 13.5px; font-weight: 700; fill: #16202E; }
      .sd { font-size: 11.5px; fill: #5A6675; }
      .sm { font-size: 11.5px; fill: #48546A; font-family: 'Consolas','Courier New',monospace; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .6px; }
      .bh { font-size: 17px; font-weight: 700; }
      .bt { font-size: 12.5px; fill: #48546A; }
      .bm { font-size: 12px; fill: #16202E; font-family: 'Consolas','Courier New',monospace; }
      .warn { font-size: 12.5px; font-weight: 700; fill: #C7253E; }
      .foot { font-size: 12px; fill: #7A8699; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="44" y="52">Beddy — AI 구성 3분류 : LLM · Agent · RAG</text>
  <text class="sub" x="44" y="80">각 능력이 무엇을 판단하고 무엇을 판단하지 않는지 명시   ·   코드 변경 전 기준 + STEP 2·3 적용 후 추가분 표시</text>

  <!-- Legend -->
  <rect x="1274" y="34" width="602" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <rect x="1292" y="48" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#5A6675" stroke-width="2"/>
  <text class="lg" x="1328" y="61">현재 코드에 있음</text>
  <rect x="1478" y="48" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#5A6675" stroke-width="2" stroke-dasharray="5 3"/>
  <text class="lg" x="1514" y="61">STEP 2·3 적용 후 추가</text>

  <!-- ============ LANE 1 : LLM ============ -->
  <rect x="44" y="118" width="592" height="58" rx="12" fill="#F0FDFA" stroke="#0E7490" stroke-width="2.6"/>
  <rect x="62" y="133" width="52" height="26" rx="6" fill="#0E7490"/>
  <text class="badge" x="72" y="151">LLM</text>
  <text class="lane" x="128" y="155" fill="#0E7490">LLM 직접 호출</text>

  <rect x="44" y="184" width="592" height="46" rx="9" fill="#FFFFFF" stroke="#A5D8DC" stroke-width="1.6"/>
  <text class="who" x="62" y="203">판단 주체 없음. 프롬프트 + 히스토리 → LLM 1회 → 출력</text>
  <text class="sd" x="62" y="221">검색 없음 · 도구 없음 · 검증 없음 · 루프 없음</text>

  <rect x="44" y="240" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text class="st" x="62" y="262">1 · 요청</text>
  <text class="sd" x="62" y="280">아이 메시지 또는 배치 트리거</text>

  <rect x="44" y="300" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text class="st" x="62" y="322">2 · 프롬프트 조립</text>
  <text class="sd" x="62" y="340">페르소나 · 대화 히스토리 · 안전 규칙 (코드가 고정 조립)</text>

  <rect x="44" y="360" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text class="st" x="62" y="382">3 · Bedrock 호출 1회</text>
  <text class="sm" x="62" y="400">Converse / ConverseStream  ·  Guardrail 적용</text>

  <rect x="44" y="420" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text class="st" x="62" y="442">4 · 응답</text>
  <text class="sd" x="62" y="460">대화는 SSE 토큰 스트리밍 · 나머지는 JSON 파싱</text>

  <rect x="44" y="480" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text class="st" x="62" y="502">5 · 응답 후 백그라운드</text>
  <text class="sd" x="62" y="520">대화 저장 · 감정 분석 — SSE done 을 먼저 닫은 뒤 실행</text>

  <rect x="44" y="546" width="592" height="284" rx="11" fill="#F8FAFC" stroke="#0E7490" stroke-width="2"/>
  <text class="bh" x="62" y="574" fill="#0E7490">호출 지점 11</text>
  <text class="sd" x="62" y="596">Haiku · purpose chat</text>
  <text class="sm" x="62" y="616">conversation.chat</text>
  <text class="sd" x="62" y="642">Haiku · purpose analysis</text>
  <text class="sm" x="62" y="662">emotion.analysis · adventure.story</text>
  <text class="sm" x="62" y="682">hospital-day.schedule-copy · memory.post</text>
  <text class="sm" x="62" y="702">companion.status</text>
  <text class="sd" x="62" y="728">Opus · purpose quality</text>
  <text class="sm" x="62" y="748">batch.memory-consolidate · growth.journal</text>
  <text class="sm" x="62" y="768">parent.empathy · parent.today-summary</text>
  <text class="sm" x="62" y="788">parent.daily-summary</text>
  <text class="warn" x="62" y="814">이 11개는 Agent 도 RAG 도 아니다</text>

  <!-- ============ LANE 2 : AGENT ============ -->
  <rect x="664" y="118" width="592" height="58" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.6"/>
  <rect x="682" y="133" width="62" height="26" rx="6" fill="#C2410C"/>
  <text class="badge" x="692" y="151">AGENT</text>
  <text class="lane" x="758" y="155" fill="#C2410C">AI Agent — 오늘의 미션</text>

  <rect x="664" y="184" width="592" height="46" rx="9" fill="#FFFFFF" stroke="#F0C9A8" stroke-width="1.6"/>
  <text class="who" x="682" y="203">LLM 이 장면을 판단하고, 그 판단이 도구 호출을 결정</text>
  <text class="sd" x="682" y="221">배치 경로(새벽)라 지연이 무관 → 판단 단계를 넣을 수 있음</text>

  <rect x="664" y="240" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text class="st" x="682" y="262">1 · 컨텍스트 7종 병렬 수집</text>
  <text class="sd" x="682" y="280">페르소나 · 병원일정 · 감정정원 · 메모리 · 보호자수 · 감정 · 날씨</text>

  <rect x="664" y="300" width="592" height="50" rx="9" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="st" x="682" y="322">2 · 계획 — LLM 이 판단</text>
  <text class="tag" x="1178" y="322" fill="#C2410C">STEP 2</text>
  <text class="sd" x="682" y="340">장면 · 근거 · 피할 것 · kind 배분   —   현재는 규칙 resolveScene()</text>

  <rect x="664" y="360" width="592" height="50" rx="9" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="st" x="682" y="382">3 · 조건부 도구 호출</text>
  <text class="tag" x="1178" y="382" fill="#C2410C">STEP 2</text>
  <text class="sd" x="682" y="400">계획이 요구할 때만 최근 7일 미션 제목 조회 → 중복 회피</text>

  <rect x="664" y="420" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text class="st" x="682" y="442">4 · 퀘스트 3개 생성</text>
  <text class="sm" x="682" y="460">Opus · purpose quality · JSON 출력</text>

  <rect x="664" y="480" width="592" height="50" rx="9" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="st" x="682" y="502">5 · 검증 — LLM 아님</text>
  <text class="tag" x="1178" y="502" fill="#C2410C">STEP 2</text>
  <text class="sd" x="682" y="520">개수 · kind 다양성 · 제목 중복 · 야외 금지 · 점수 범위</text>

  <rect x="664" y="540" width="592" height="50" rx="9" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="st" x="682" y="562">6 · 자기수정 최대 1회</text>
  <text class="tag" x="1178" y="562" fill="#C2410C">STEP 2</text>
  <text class="sd" x="682" y="580">문제점을 프롬프트에 명시해 재생성 · 예산 4초 남아야 시도</text>

  <rect x="664" y="600" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.8"/>
  <text class="st" x="682" y="622">7 · 규칙 폴백</text>
  <text class="sm" x="682" y="640">buildRuleBasedPack()  ·  generatedBy 로 구분</text>

  <rect x="664" y="666" width="592" height="164" rx="11" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text class="bh" x="682" y="694" fill="#C2410C">호출 지점</text>
  <text class="sm" x="682" y="718">agent.mission.plan  ·  Haiku</text>
  <text class="sm" x="682" y="738">agent.mission.generate  ·  Opus</text>
  <text class="sm" x="682" y="758">agent.mission.repair  ·  Opus</text>
  <text class="sd" x="682" y="782">feature 접두사 agent.mission.* 로 대시보드에서 분류</text>
  <text class="warn" x="682" y="808">시스템에서 Agent 는 이것 하나뿐이다</text>

  <!-- ============ LANE 3 : RAG ============ -->
  <rect x="1284" y="118" width="592" height="58" rx="12" fill="#F5F1FF" stroke="#6B2BE0" stroke-width="2.6"/>
  <rect x="1302" y="133" width="48" height="26" rx="6" fill="#6B2BE0"/>
  <text class="badge" x="1312" y="151">RAG</text>
  <text class="lane" x="1364" y="155" fill="#6B2BE0">RAG — 장기기억 검색</text>

  <rect x="1284" y="184" width="592" height="46" rx="9" fill="#FFFFFF" stroke="#C9B8F5" stroke-width="1.6"/>
  <text class="who" x="1302" y="203">과거 요약을 검색해 근거로 쓴다. 도구 선택도 루프도 없음</text>
  <text class="sd" x="1302" y="221">Agent 가 아니다 · 검색 대상은 요약 문서뿐, 대화 원문 아님</text>

  <rect x="1284" y="240" width="592" height="50" rx="9" fill="#F5F1FF" stroke="#6B2BE0" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="st" x="1302" y="262">1 · 질의 재작성 — LLM</text>
  <text class="tag" x="1798" y="262" fill="#6B2BE0">STEP 3</text>
  <text class="sd" x="1302" y="280">질문 1개 → 검색 질의 2~3개   —   현재는 원문 그대로 1개</text>

  <rect x="1284" y="300" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#6B2BE0" stroke-width="1.8"/>
  <text class="st" x="1302" y="322">2 · Knowledge Bases 검색</text>
  <text class="sm" x="1302" y="340">RetrieveCommand · KB GREBZFCNYP · S3 Vectors</text>

  <rect x="1284" y="360" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#6B2BE0" stroke-width="1.8"/>
  <text class="st" x="1302" y="382">3 · 소유자 경로 필터</text>
  <text class="sm" x="1302" y="400">kb-summaries/{childUserId}/ 밖의 히트는 전부 폐기</text>

  <rect x="1284" y="420" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#6B2BE0" stroke-width="1.8"/>
  <text class="st" x="1302" y="442">4 · 프라이버시 필터</text>
  <text class="sd" x="1302" y="460">원문 대화 패턴 · 좌표 패턴 탐지 후 폐기 (정규식)</text>

  <rect x="1284" y="480" width="592" height="50" rx="9" fill="#F5F1FF" stroke="#6B2BE0" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="st" x="1302" y="502">5 · 충분성 판정 + 재검색 1회</text>
  <text class="tag" x="1798" y="502" fill="#6B2BE0">STEP 3</text>
  <text class="sd" x="1302" y="520">히트 0건 또는 점수 미달 → 질의 완화 후 1회만 (LLM 없이)</text>

  <rect x="1284" y="540" width="592" height="50" rx="9" fill="#FFFFFF" stroke="#6B2BE0" stroke-width="1.8"/>
  <text class="st" x="1302" y="562">6 · 요약만 주입해 생성</text>
  <text class="sm" x="1302" y="580">Opus · purpose quality · 근거 라벨을 응답에 함께 반환</text>

  <rect x="1284" y="606" width="592" height="224" rx="11" fill="#F5F1FF" stroke="#6B2BE0" stroke-width="2"/>
  <text class="bh" x="1302" y="634" fill="#6B2BE0">소비처 2곳</text>
  <text class="sm" x="1302" y="658">parent.report</text>
  <text class="sd" x="1302" y="676">보호자 질문이 그대로 검색 질의가 된다</text>
  <text class="sd" x="1302" y="694">→ STEP 3 의 질의 재작성 대상</text>
  <text class="sm" x="1302" y="722">growth.storybook</text>
  <text class="sd" x="1302" y="740">질의가 고정 템플릿이다</text>
  <text class="sm" x="1302" y="758">"{이름} 병원 여정 모험 감정 소원"</text>
  <text class="sd" x="1302" y="776">→ 재작성 불필요 · 현재 구조 유지</text>
  <text class="warn" x="1302" y="806">보호자 화면은 Agent 가 아니라 RAG 다</text>

  <!-- 레인은 순차 흐름이 아니라 병렬 분류다. 연결 화살표를 의도적으로 두지 않는다. -->

  <!-- ============ BOTTOM : 배관 ============ -->
  <rect x="44" y="854" width="1180" height="152" rx="12" fill="#F8FAFC" stroke="#5A6675" stroke-width="2.2"/>
  <text class="bh" x="64" y="882" fill="#334155">LLM Gateway — 배관 · AI 능력 아님</text>
  <text class="bm" x="64" y="908">backend/ai/llm-gateway.ts  —  배관(모델·Guardrail·계측). 판단 없음</text>
  <text class="bt" x="64" y="932">위 세 레인의 모든 LLM 호출이 이 한 곳을 지난다. purpose → 모델 ID 매핑, Guardrail 부착, 계측.</text>
  <text class="warn" x="64" y="956">판단하지 않는다 · 라우팅하지 않는다 · 어느 능력이 요청을 처리할지 결정하지 않는다</text>
  <text class="bt" x="64" y="980">purpose 와 feature 를 정하는 주체는 호출자다. 그래서 오케스트레이터도 슈퍼바이저도 아니다.</text>
  <text class="bt" x="64" y="1000">효과 — getLlmProvider() 우회 호출 0건이라 Guardrail 누락이 구조적으로 불가능하고, 기능별 지연을 분리 계측한다.</text>

  <rect x="1252" y="854" width="624" height="152" rx="12" fill="#FFFFFF" stroke="#C7253E" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text class="bh" x="1272" y="882" fill="#C7253E">프라이버시 경계 — AI 아님</text>
  <text class="bm" x="1272" y="908">backend/ai/bridge/privacy-filter.ts</text>
  <text class="bt" x="1272" y="932">정규식 2개. 원문 대화 마커와 좌표 패턴을 탐지해 폐기한다.</text>
  <text class="bt" x="1272" y="956">RAG 4단계에서 호출되며, 아이 공간 → 보호자 공간의 유일한 통과 지점이다.</text>
  <text class="warn" x="1272" y="982">보호자 응답에도 검색 색인에도 대화 원문은 들어가지 않는다</text>
  <text class="bt" x="1272" y="1002">LLM 을 쓰지 않는다. 판정이 결정론적이라 설명하고 테스트할 수 있다.</text>

  <text class="foot" x="44" y="1044">AI 능력은 3개다. LLM 직접 호출 1 · Agent 1 · RAG 1.  배관과 경계는 능력으로 세지 않는다.</text>
  <text class="foot" x="44" y="1066">모델 ID · Guardrail ID · KB ID · 호출 지점 이름은 코드와 .env.local 에서 확인한 실제 값이다.</text>
</svg>
