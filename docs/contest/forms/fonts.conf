<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>맑은 고딕</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit></match>
  <match target="pattern"><test name="family"><string>Malgun Gothic</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit></match>
</fontconfig>
