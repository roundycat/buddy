<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 15px; fill: #475569; }
      .h1 { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 12.5px; fill: #334155; }
      .s { font-size: 11.5px; fill: #64748b; }
      .ln { fill:none; stroke:#64748B; stroke-width:2.2; marker-end:url(#a); }
      .tag { font-size:11px; font-weight:700; fill:#fff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text class="title" x="44" y="56">입원 → 퇴원 플로우 + AWS 서비스 + LLM/Agent/RAG</text>
  <text class="sub" x="44" y="84">핵심: LLM(실시간 채팅), Agent(미션 계획), RAG(보호자 질문) / 어떤 AWS 서비스를 쓰는지 포함</text>

  <!-- AWS services strip -->
  <rect x="44" y="112" width="1832" height="126" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="h1" x="64" y="144">사용 AWS 서비스 (실제 런타임/배치)</text>
  <rect x="64" y="160" width="150" height="56" rx="10" fill="#e2e8f0"/><text class="h2" x="88" y="194">ALB</text>
  <rect x="226" y="160" width="170" height="56" rx="10" fill="#e2e8f0"/><text class="h2" x="250" y="194">ECS Fargate</text>
  <rect x="408" y="160" width="150" height="56" rx="10" fill="#dbeafe"/><text class="h2" x="430" y="194">Bedrock</text>
  <rect x="570" y="160" width="170" height="56" rx="10" fill="#dcfce7"/><text class="h2" x="594" y="194">DynamoDB</text>
  <rect x="752" y="160" width="130" height="56" rx="10" fill="#dcfce7"/><text class="h2" x="792" y="194">S3</text>
  <rect x="894" y="160" width="180" height="56" rx="10" fill="#ffedd5"/><text class="h2" x="918" y="194">EventBridge</text>
  <rect x="1086" y="160" width="190" height="56" rx="10" fill="#ffedd5"/><text class="h2" x="1110" y="194">CloudWatch</text>
  <rect x="1288" y="160" width="220" height="56" rx="10" fill="#f5d0fe"/><text class="h2" x="1312" y="194">Secrets Manager</text>
  <rect x="1520" y="160" width="140" height="56" rx="10" fill="#dbeafe"/><text class="h2" x="1560" y="194">Polly</text>
  <rect x="1672" y="160" width="180" height="56" rx="10" fill="#dbeafe"/><text class="h2" x="1696" y="194">Guardrails/KB</text>

  <!-- Left column: journey -->
  <rect x="44" y="268" width="720" height="768" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text class="h1" x="64" y="300">입원 → 퇴원 사용자 여정</text>

  <rect x="64" y="322" width="680" height="88" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h2" x="84" y="354">1) 입원/온보딩</text>
  <text class="t" x="84" y="378">아이·보호자 계정 연결, 기본 페르소나/개인 설정 초기화</text>

  <rect x="64" y="428" width="680" height="130" rx="12" fill="#ffffff" stroke="#0284c7"/>
  <text class="h2" x="84" y="460" fill="#0369a1">2) 입원 중 실시간 채팅 (LLM)</text>
  <text class="t" x="84" y="484">Browser → ALB → ECS(Next.js API) → Bedrock(Haiku + Guardrails)</text>
  <text class="s" x="84" y="506">참조: 페르소나 + memory summary / 결과: 상태는 DynamoDB, 미디어는 S3</text>
  <rect x="660" y="438" width="74" height="24" rx="8" fill="#0369a1"/><text class="tag" x="683" y="455">LLM</text>

  <rect x="64" y="576" width="680" height="130" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text class="h2" x="84" y="608" fill="#c2410c">3) 새벽 배치(05:00 KST) + 미션 Agent</text>
  <text class="t" x="84" y="632">EventBridge → /api/cron/daily → memory/emotion/story 정리 → mission plan</text>
  <text class="s" x="84" y="654">Agent 도구 참조: emotional-guidance.cards.json + recent quest titles(DynamoDB)</text>
  <rect x="660" y="586" width="74" height="24" rx="8" fill="#c2410c"/><text class="tag" x="676" y="603">AGENT</text>

  <rect x="64" y="724" width="680" height="150" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
  <text class="h2" x="84" y="756" fill="#7e22ce">4) 보호자 질문/리포트 (RAG)</text>
  <text class="t" x="84" y="780">질문 → query rewrite → KB retrieve → Bridge filter → 요약 답변</text>
  <text class="s" x="84" y="802">RAG 문서 참조: S3 kb-summaries/{childId}/{date}-{memory|emotion|mission|timeline|interests}.md</text>
  <text class="s" x="84" y="824">실행 파일: guardian-rag.ts / retrieve.ts / index-summaries.ts / privacy-filter.ts</text>
  <rect x="660" y="734" width="74" height="24" rx="8" fill="#7e22ce"/><text class="tag" x="684" y="751">RAG</text>

  <rect x="64" y="892" width="680" height="126" rx="12" fill="#ecfdf5" stroke="#16a34a"/>
  <text class="h2" x="84" y="924" fill="#15803d">5) 퇴원</text>
  <text class="t" x="84" y="948">이야기책 완결 + 퇴원 편지 잠금 해제 시점 도달 시 오픈</text>
  <text class="s" x="84" y="970">보호자 화면에는 끝까지 원문 채팅이 아닌 요약 정보만 노출</text>

  <!-- Right column: architecture flow -->
  <rect x="804" y="268" width="1072" height="768" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="h1" x="824" y="300">서비스 중심 플로우 (Runtime + Batch)</text>

  <!-- runtime path -->
  <rect x="824" y="330" width="1032" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="h2" x="844" y="362">실시간 경로 (입원 중 채팅/화면)</text>
  <rect x="844" y="378" width="150" height="54" rx="10" fill="#e2e8f0"/><text class="t" x="866" y="410">Browser</text>
  <rect x="1018" y="378" width="120" height="54" rx="10" fill="#e2e8f0"/><text class="t" x="1056" y="410">ALB</text>
  <rect x="1162" y="378" width="170" height="54" rx="10" fill="#e2e8f0"/><text class="t" x="1190" y="410">ECS App</text>
  <rect x="1356" y="378" width="170" height="54" rx="10" fill="#dbeafe"/><text class="t" x="1384" y="410">Bedrock</text>
  <rect x="1550" y="378" width="140" height="54" rx="10" fill="#dcfce7"/><text class="t" x="1586" y="410">DynamoDB</text>
  <rect x="1714" y="378" width="120" height="54" rx="10" fill="#dcfce7"/><text class="t" x="1752" y="410">S3</text>
  <path class="ln" d="M 994 405 L 1018 405"/>
  <path class="ln" d="M 1138 405 L 1162 405"/>
  <path class="ln" d="M 1332 405 L 1356 405"/>
  <path class="ln" d="M 1526 405 L 1550 405"/>
  <path class="ln" d="M 1526 430 L 1714 430"/>
  <text class="s" x="844" y="460">Secrets Manager로 키 주입, CloudWatch로 지표/로그 수집</text>

  <!-- batch path -->
  <rect x="824" y="548" width="1032" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="h2" x="844" y="580">새벽 배치 경로 (Agent + RAG 문서 준비)</text>
  <rect x="844" y="596" width="180" height="58" rx="10" fill="#ffedd5"/><text class="t" x="868" y="631">EventBridge</text>
  <rect x="1048" y="596" width="180" height="58" rx="10" fill="#e2e8f0"/><text class="t" x="1072" y="631">ECS /cron</text>
  <rect x="1252" y="596" width="210" height="58" rx="10" fill="#fff7ed"/><text class="t" x="1276" y="631">Mission Agent</text>
  <rect x="1486" y="596" width="170" height="58" rx="10" fill="#dcfce7"/><text class="t" x="1516" y="631">DynamoDB</text>
  <rect x="1680" y="596" width="154" height="58" rx="10" fill="#dcfce7"/><text class="t" x="1714" y="631">S3 KB docs</text>
  <path class="ln" d="M 1024 625 L 1048 625"/>
  <path class="ln" d="M 1228 625 L 1252 625"/>
  <path class="ln" d="M 1462 625 L 1486 625"/>
  <path class="ln" d="M 1656 625 L 1680 625"/>
  <text class="s" x="844" y="684">S3 문서: memory/emotion/mission/timeline/interests → Bedrock KB retrieve 대상</text>
  <text class="s" x="844" y="706">정리/필터링 후만 저장 (privacy-filter로 원문/좌표 차단)</text>

  <!-- parent rag path -->
  <rect x="824" y="786" width="1032" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="h2" x="844" y="818">보호자 질의 경로 (RAG)</text>
  <rect x="844" y="834" width="190" height="58" rx="10" fill="#f5d0fe"/><text class="t" x="872" y="869">Parent UI</text>
  <rect x="1058" y="834" width="210" height="58" rx="10" fill="#faf5ff"/><text class="t" x="1086" y="869">guardian-rag.ts</text>
  <rect x="1292" y="834" width="190" height="58" rx="10" fill="#dbeafe"/><text class="t" x="1322" y="869">Bedrock KB</text>
  <rect x="1506" y="834" width="170" height="58" rx="10" fill="#fef2f2"/><text class="t" x="1530" y="869">Bridge filter</text>
  <rect x="1700" y="834" width="134" height="58" rx="10" fill="#fdf2f8"/><text class="t" x="1724" y="869">Answer</text>
  <path class="ln" d="M 1034 863 L 1058 863"/>
  <path class="ln" d="M 1268 863 L 1292 863"/>
  <path class="ln" d="M 1482 863 L 1506 863"/>
  <path class="ln" d="M 1676 863 L 1700 863"/>
  <text class="s" x="844" y="924">항상 차단: 채팅 원문·일기 원문·GPS·타 아동 데이터 / 보호자는 요약 결과만 확인</text>
</svg>
