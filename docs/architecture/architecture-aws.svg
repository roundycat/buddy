    <circle cx="18" cy="19" r="2.4" fill="#FFFFFF"/>
  </g>
  <text class="h1" x="1096" y="444" fill="#A11BA8">Amazon DynamoDB</text>
  <text class="cs" x="1048" y="486">단일 테이블 — 앱 데이터 · 인증 · 미션 이력 전부</text>
  <text class="cm" x="1048" y="510">MAP#ns  ·  EMAIL#메일  ·  USER#id</text>
  <text class="cx" x="1048" y="534">관계형 DB 없이 통합 — Aurora 제거 완료</text>
  <text class="cx" x="1048" y="554">시점 복구 35일 · 삭제 방지 켜짐</text>

  <rect x="1024" y="700" width="405" height="170" rx="14" fill="#FFFFFF" stroke="#DD344C" stroke-width="2.6"/>
  <g transform="translate(1048,718)">
