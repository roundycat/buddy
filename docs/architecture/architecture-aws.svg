  </g>
  <text class="h1" x="1096" y="744" fill="#BE123C">Secrets Manager</text>
  <text class="cm" x="1048" y="786">AUTH_SESSION_SECRET · CRON_SECRET</text>
  <text class="cs" x="1048" y="810">태스크 정의 평문 제거 · valueFrom 참조</text>
  <text class="cx" x="1048" y="834">IAM 태스크 롤은 테이블·프리픽스 단위로 좁힘</text>
  <text class="cx" x="1048" y="854">cron 은 timingSafeEqual 상수 시간 비교</text>

