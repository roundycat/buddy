  <text class="cs" x="614" y="518">Bedrock Tool Use — 모델이 도구를 고른다</text>
  <text class="cx" x="614" y="534">근거 카드 검색 · 최근 미션 조회 · 계획 제출</text>

  <rect x="596" y="558" width="368" height="90" rx="11" fill="#FFFFFF" stroke="#6B2BE0" stroke-width="2.6"/>
  <rect x="596" y="558" width="68" height="20" rx="6" fill="#6B2BE0"/>
