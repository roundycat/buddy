  <!-- EventBridge → ECS (새벽 배치가 미션·요약·색인 잡을 깨운다) -->
  <path class="ln" d="M 768 700 L 768 670" stroke="#E7157B" marker-end="url(#ap)"/>
  <text class="alp" x="782" y="690">POST /api/cron/daily</text>

  <!-- LLM Gateway → Bedrock : 유일한 모델 호출자 -->
  <path class="ln" d="M 964 285 L 1024 285" stroke="#0F766E" marker-end="url(#at)"/>

  <!-- ECS(전체) → DynamoDB : 앱 데이터 · 인증 · 대화기록 · 미션이력을 통째로 저장 -->
  <path class="ln" d="M 988 444 L 1024 444" stroke="#A11BA8" marker-end="url(#an)"/>

  <!-- ECS(전체) → S3 : 사진·아바타·삽화 업로드 (Agent/RAG 와 무관한 일반 라우트) -->
  <path class="ln" d="M 988 338 L 1447 338 L 1447 235 L 1465 235" stroke="#4D7C0F" marker-end="url(#ag)"/>
  <text class="alg" x="1010" y="330">아바타 · 삽화 · 사진첩</text>

  <!-- RAG → Knowledge Bases : 유일한 검색 호출자 -->
  <path class="ln" d="M 964 603 L 1447 603 L 1447 485 L 1465 485" stroke="#6B2BE0" marker-end="url(#av)"/>
  <text class="alv" x="1010" y="595">Retrieve — 요약 문서만</text>

  <!-- ECS(전체) → CloudWatch : 모든 라우트의 구조화 로그와 지연 메트릭 -->
  <path class="ln" d="M 988 659 L 1447 659 L 1447 785 L 1465 785" stroke="#E7157B" marker-end="url(#ap)"/>
  <text class="alp" x="1010" y="678">메트릭 · 구조화 로그</text>

  <!-- Knowledge Bases → S3 : 색인은 S3 Vectors 에 적재 -->
  <path class="ln" d="M 1667 400 L 1667 320" stroke="#0F766E" marker-end="url(#at)"/>
  <text class="alt" x="1682" y="364">S3 Vectors · kb-summaries/</text>

  <!-- Secrets Manager → ECS : 컨테이너 시작 시 평문 없이 주입 (RAG 박스 하단 여백을 지나 EventBridge 화살표와 완전히 분리) -->
  <path class="ln" d="M 1024 750 L 1006 750 L 1006 664 L 988 664" stroke="#BE123C" marker-end="url(#ar)"/>
  <text class="alr" x="826" y="660">시작 시 주입</text>

  <!-- ============ FOOTER ============ -->
  <line x1="50" y1="900" x2="1870" y2="900" stroke="#E2E8EE" stroke-width="2"/>

  <text class="fh" x="50" y="930" fill="#0E7490">즉시 경로</text>
  <text class="ft" x="176" y="930">환아가 기다리는 것만 처리합니다. 대화는 Bedrock 1회 호출로 응답하고 SSE 를 먼저 닫습니다. 저장과 감정 분석은 그 뒤에 돕니다.</text>

  <text class="fh" x="50" y="960" fill="#C2410C">Agent 경로</text>
  <text class="ft" x="176" y="960">오늘의 미션만 Tool Use 입니다. 모델이 근거 카드와 최근 이력 중 필요한 것을 골라 호출합니다. 새벽 배치라 지연이 무관해서 넣을 수 있었습니다.</text>

  <text class="fh" x="50" y="990" fill="#6B2BE0">RAG 경로</text>
  <text class="ft" x="176" y="990">보호자 질문을 검색 질의로 재작성해 Knowledge Bases 를 병렬 조회합니다. 근거가 부족하면 한 번 더 넓혀 검색합니다.</text>

  <text class="fh" x="50" y="1020" fill="#C7253E">프라이버시</text>
  <text class="ft" x="176" y="1020">대화 원문은 어떤 경로로도 보호자에게 가지 않습니다. 검색 색인에도 원문을 넣지 않고, 소유자 경로 밖 히트는 전부 폐기합니다.</text>

  <text class="cx" x="50" y="1056">환아는 비밀친구를 믿을 수 있는 친구로 느끼고, 보호자는 감시가 아니라 이해를 받습니다.</text>
</svg>
