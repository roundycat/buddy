  <text class="cs" x="572" y="776">새벽 배치 4잡 — 기억 통합 · 미션 · 보호자 요약 · KB 색인</text>
  <text class="cx" x="572" y="800">API Destination → 202 즉시 반환 + 날짜별 멱등성</text>

