  <text class="h1" x="1537" y="194" fill="#4D7C0F">Amazon S3</text>
  <text class="cs" x="1489" y="236">쓰는 곳 둘 — 앱이 직접 · Knowledge Bases 가 색인</text>
  <text class="cm" x="1489" y="260">avatars/ · photos/ · kb-summaries/ · vectors/</text>
  <text class="cx" x="1489" y="284">공개 버킷 아님 — 퍼블릭 차단 4종 전부</text>
  <text class="cx" x="1489" y="304">앱이 소유자 확인 후 직접 전달</text>

