  <text class="title" x="50" y="58">Beddy — AWS 아키텍처</text>
  <text class="sub" x="50" y="90">장기 입원 환아를 위한 AI 디지털 동반자   ·   us-east-1 (이미지 생성만 us-west-2)   ·   AWS 서비스 10종</text>

