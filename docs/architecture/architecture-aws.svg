  <text class="cs" x="1489" y="486">장기 기억 검색 (RAG)</text>
  <text class="cm" x="1489" y="510">RetrieveCommand · KB GREBZFCNYP</text>
  <text class="cx" x="1489" y="534">색인 대상은 요약 문서만 — 원문 제외</text>
  <text class="cx" x="1489" y="554">소유자 경로 밖 히트는 전부 폐기</text>

