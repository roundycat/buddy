  <text class="cs" x="614" y="412">Bedrock Converse 1회 호출 · SSE 스트리밍</text>
  <text class="cx" x="614" y="428">가장 많이 쓰는 기능 — Agent·RAG 를 거치지 않는다</text>

  <rect x="596" y="452" width="368" height="90" rx="11" fill="#FFFFFF" stroke="#ED7100" stroke-width="2.6"/>
  <rect x="596" y="452" width="100" height="20" rx="6" fill="#C2410C"/>
