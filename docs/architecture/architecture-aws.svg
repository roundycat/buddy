  <text class="h1" x="1096" y="194" fill="#0F766E">Amazon Bedrock</text>
  <text class="cs" x="1048" y="236">Converse · ConverseStream · toolConfig</text>
  <text class="cm" x="1048" y="260">chat/analysis → Haiku 4.5   quality → Opus 4.6</text>
  <text class="cx" x="1048" y="284">대화 · 감정 분석 · 미션 · 보호자 요약이 모두 경유</text>
  <text class="cx" x="1048" y="304">Guardrails 로 의료 진단 차단 · 이미지는 us-west-2</text>

  <rect x="1024" y="400" width="405" height="170" rx="14" fill="#FFFFFF" stroke="#C925D1" stroke-width="2.6"/>
  <g transform="translate(1048,418)">
