  <text class="cm" x="416" y="356">POST /api/garden/plant</text>
  <text class="cm" x="416" y="376">POST /api/photos  ·  GET /api/photos/[id]</text>
  <text class="cm" x="416" y="396">POST /api/wallet/claim</text>
  <text class="cm" x="416" y="416">GET  /api/hospital-day  ·  PATCH</text>
  <text class="cm" x="416" y="436">POST /api/persona/generate  ·  avatar 3종</text>
  <text class="cm" x="416" y="456">POST /api/storybook/compose</text>
  <text class="cm" x="416" y="476">POST /api/weather</text>

  <text class="h2" x="416" y="510" fill="#B45309">보호자 경로</text>
  <text class="cm" x="416" y="532">GET  /api/parent/home · report · timeline</text>
