  <text class="h1" x="102" y="195" fill="#16202E">Beddy 웹앱</text>
  <text class="cx" x="64" y="220">Next.js 14 App Router · 페이지 19</text>
  <text class="cm" x="64" y="240">middleware.ts — 쿠키로 역할 분기</text>

  <rect x="62" y="256" width="274" height="100" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
  <text class="h2" x="80" y="280" fill="#0E7490">환아용   role = child</text>
  <text class="cs" x="80" y="304">대기실 · 정원 · 모험 · 소원 · 사진첩</text>
  <text class="cs" x="80" y="325">SSE 로 토큰 단위 수신</text>
  <text class="cx" x="80" y="345">보호자 공간 접근 차단</text>

  <rect x="62" y="372" width="274" height="100" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
  <text class="h2" x="80" y="396" fill="#B45309">보호자용   role = guardian</text>
  <text class="cs" x="80" y="420">홈 · 리포트 · 여정 · 프로필 · 일정</text>
  <text class="cs" x="80" y="441">요약만 수신</text>
  <text class="cx" x="80" y="461">아동 공간 접근 차단</text>

  <rect x="44" y="520" width="310" height="150" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text class="h2" x="64" y="548" fill="#DC2626">브라우저 위치 권한</text>
  <text class="cm" x="64" y="572">navigator.geolocation</text>
  <text class="cs" x="64" y="596">좌표를 소수점 1자리로 반올림 후</text>
  <text class="cs" x="64" y="617">POST /api/weather 로만 전송</text>
  <text class="cx" x="64" y="640">약 11km 단위 · 거부해도 다른 기능 정상</text>

