  <rect x="44" y="742" width="1206" height="200" rx="13" fill="#FFFFFF" stroke="#E7157B" stroke-width="2.6"/>
  <g transform="translate(64,760)"><rect width="30" height="30" rx="7" fill="url(#gCos)"/><circle cx="15" cy="15" r="8.4" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><line x1="15" y1="15" x2="15" y2="9.4" stroke="#FFFFFF" stroke-width="1.8"/><line x1="15" y1="15" x2="19.2" y2="17.5" stroke="#FFFFFF" stroke-width="1.8"/></g>
  <text class="h1" x="104" y="782" fill="#BE185D">Amazon EventBridge  →  API Destination  →  POST /api/cron/daily</text>
  <text class="cw" x="64" y="810">API Destination 응답 타임아웃 5초 → 202 즉시 반환 후 백그라운드 실행 · 날짜별 멱등성 마커로 재시도 중복 차단</text>

  <rect x="64" y="826" width="284" height="98" rx="9" fill="#FDF2F8" stroke="#E7157B" stroke-width="1.6"/>
