  <text class="cs" x="848" y="306">모델 · Guardrails · 계측 · 판단 없음</text>

  <rect x="830" y="336" width="400" height="86" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="2.4"/>
