  <!-- 외부 API -->
  <text class="lab" x="1300" y="726">EXTERNAL API</text>
  <rect x="1300" y="742" width="576" height="200" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text class="h1" x="1320" y="774" fill="#DC2626">Open-Meteo   ·   외부 호출은 이것뿐</text>
  <text class="cm" x="1320" y="800">api.open-meteo.com/v1/forecast</text>
  <text class="cm" x="1320" y="822">daily=weather_code,temperature_2m_max · timezone=Asia/Seoul</text>
  <text class="cs" x="1320" y="848">API 키 불필요 · 서버에서만 호출 · 45분 인프로세스 캐시</text>
  <text class="cs" x="1320" y="870">새벽 배치는 current 가 아니라 일일 예보를 조회</text>
  <text class="cx" x="1320" y="894">위치 미보고 시 기본값 lat 37.6 / lon 127.0 · 실패 시 날짜 해시 폴백</text>
  <text class="cw" x="1320" y="920">제3자가 보는 것은 아이 기기가 아니라 ECS 송신 IP</text>

  <text class="cx" x="44" y="990">즉시 경로 — 대화는 Bedrock 1회 호출로 응답하고 SSE done 을 먼저 닫습니다. 저장과 감정 분석은 응답 이후 백그라운드에서 실행됩니다.</text>
  <text class="cx" x="44" y="1014">배치 경로 — 미션 · 요약 · 기억 통합 · KB 색인을 전날 밤에 미리 만들어 DynamoDB 에 저장하고, 즉시 경로는 읽기만 합니다.</text>
  <text class="cx" x="44" y="1038">프라이버시 — 대화 원문은 보호자 응답에도, 검색 색인에도 들어가지 않습니다. AI Bridge 가 요약만 통과시킵니다.</text>
