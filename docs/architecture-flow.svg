  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="44" y="56">Beddy — 서비스와 API 흐름</text>
  <text class="sub" x="44" y="86">1 / 2   ·   클라이언트에서 AWS 서비스까지의 요청 경로와 내부 API</text>

