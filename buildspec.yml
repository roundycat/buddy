version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - IMAGE_URI_LATEST=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:latest
  build:
    commands:
      - echo Build started on `date`
      - docker build -t $IMAGE_URI -t $IMAGE_URI_LATEST .
  post_build:
    commands:
      - echo Pushing images...
      - docker push $IMAGE_URI
      - docker push $IMAGE_URI_LATEST
      - printf '[{"name":"bedi-app","imageUri":"%s"}]' $IMAGE_URI_LATEST > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
